openapi: 3.0.3
info:
  title: Mainz World API
  description: PHP REST API backing the Mainz World React front end.
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /projects:
    get:
      summary: List all linked projects
      operationId: listProjects
      responses:
        '200':
          description: Array of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
  /properties:
    get:
      summary: List scraped tax/sheriff sale properties
      operationId: listProperties
      responses:
        '200':
          description: Array of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleProperty'
  /scrape-sources:
    get:
      summary: List configured SRI scrape sources (admin only)
      operationId: listScrapeSources
      responses:
        '200':
          description: Configured SRI sources
        '403':
          description: Admin role required
    post:
      summary: Add an SRI county scrape URL and queue a background scrape (admin only)
      operationId: createScrapeSource
      responses:
        '200':
          description: Source created; scrape queued to a background worker
        '400':
          description: Invalid SRI URL or label
  /scrape-sources/{id}:
    delete:
      summary: Remove an SRI scrape source (admin only)
      operationId: deleteScrapeSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Source removed
  /property-sources:
    post:
      summary: Save SRI and GIS property sources and queue a background scrape of submitted SRI sources (admin only)
      operationId: createPropertySources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [sri, gis]
                - required: [sri_sources, gis_sources]
              properties:
                sri:
                  $ref: '#/components/schemas/SriSource'
                gis:
                  $ref: '#/components/schemas/GisSource'
                sri_sources:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/SriSource'
                gis_sources:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/GisSource'
      responses:
        '200':
          description: Sources saved and SRI scrape queued (returns immediately; poll /scrape-sources for status)
        '400':
          description: Invalid source payload
        '401':
          description: Login required
        '403':
          description: Admin role required
  /property-lists:
    get:
      summary: List custom property lists for the logged-in user
      operationId: listPropertyLists
      responses:
        '200':
          description: User-owned property lists
        '401':
          description: Login required
    post:
      summary: Create a named property list for the logged-in user
      operationId: createPropertyList
      responses:
        '200':
          description: Created property list
        '409':
          description: List name already exists for this user
  /property-lists/{id}:
    get:
      summary: Load saved properties and archived snapshots in a custom list
      operationId: getPropertyList
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Saved property records, including archived status
        '401':
          description: Login required
    delete:
      summary: Delete a property list owned by the logged-in user
      operationId: deletePropertyList
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
        '404':
          description: List not found
  /auth/login:
    post:
      summary: Log in with username/password (session cookie)
      operationId: login
      responses:
        '200':
          description: Logged in
        '401':
          description: Invalid credentials
  /auth/logout:
    post:
      summary: Log out (destroys session)
      operationId: logout
      responses:
        '200':
          description: Logged out
  /auth/me:
    get:
      summary: Get the current logged-in user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
        '401':
          description: Not logged in
  /users:
    get:
      summary: List users (admin only)
      operationId: listUsers
      responses:
        '200':
          description: Array of users
        '403':
          description: Admin role required
    post:
      summary: Create a user (admin only)
      operationId: createUser
      responses:
        '200':
          description: Created
        '409':
          description: Username already exists
  /users/{id}/activate:
    post:
      summary: Reactivate a user (admin only)
      operationId: activateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /users/{id}/deactivate:
    post:
      summary: Deactivate a user (admin only)
      operationId: deactivateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /content:
    get:
      summary: List CMS content for a page
      operationId: listContent
      parameters:
        - name: page
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Array of content items
    post:
      summary: Create a CMS content item (login required)
      operationId: createContent
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                page:
                  type: string
                title:
                  type: string
                details:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Created
        '401':
          description: Login required
  /budget/transactions:
    get:
      summary: List imported budget transactions
      operationId: listBudgetTransactions
      parameters:
        - name: budget_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Array of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetTransaction'
  /budget/summary:
    get:
      summary: Get budgeted versus actual spending for a selected month
      operationId: getBudgetSummary
      parameters:
        - name: budget_id
          in: query
          schema:
            type: integer
        - name: month
          in: query
          required: true
          schema:
            type: string
            example: 2026-08
      responses:
        '200':
          description: Category budget targets and actual spending
  /budget/categories/{id}:
    post:
      summary: Save a category budget target (owner/editor)
      operationId: updateBudgetCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Saved
        '403':
          description: Write permission required
  /budget/budgets:
    get:
      summary: List budgets accessible to the logged-in user
      operationId: listBudgets
      responses:
        '200':
          description: Accessible budgets and permissions
        '401':
          description: Login required
    post:
      summary: Create a private budget owned by the logged-in user
      operationId: createBudget
      responses:
        '200':
          description: Created budget
        '401':
          description: Login required
  /budget/budgets/{id}:
    delete:
      summary: Delete an owned budget and its dependent data
      operationId: deleteBudget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Budget deleted
        '403':
          description: Owner permission required
  /budget/share:
    post:
      summary: Share an owned budget with another username
      operationId: shareBudget
      responses:
        '200':
          description: Budget shared
        '403':
          description: Owner permission required
  /budget/budgets/{id}/members:
    get:
      summary: List budget members and available users (owner only)
      operationId: listBudgetMembers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Budget members and available active users
        '403':
          description: Owner permission required
  /budget/budgets/{id}/members/{userId}:
    delete:
      summary: Remove a user's access to a budget (owner only)
      operationId: unshareBudget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Access removed
        '403':
          description: Owner permission required
        '404':
          description: Shared user not found or owner access cannot be removed
  /budget/import:
    post:
      summary: Import transactions from an uploaded CSV or XLSX file (login required)
      description: |
        Accepts CSV, XLS, and XLSX files with flexible, case-insensitive headers.
        Required columns are Date/Posting Date, Description/Memo, and either Amount or Debit/Credit.
        Optional recognized columns include Merchant/Payee, Account, Category, Reference, and Balance.
      operationId: importBudgetTransactions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Number of transactions imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  skipped_duplicates:
                    type: integer
        '400':
          description: Invalid file or missing required columns
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Login required
  /debts:
    get:
      summary: List the logged-in user's debts
      operationId: listDebts
      responses:
        '200':
          description: Array of the user's debts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Debt'
        '401':
          description: Login required
    post:
      summary: Create a debt owned by the logged-in user
      operationId: createDebt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtInput'
      responses:
        '200':
          description: Created debt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debt'
        '400':
          description: Invalid debt fields
        '401':
          description: Login required
  /debts/{id}:
    post:
      summary: Update one of the logged-in user's debts
      operationId: updateDebt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtInput'
      responses:
        '200':
          description: Updated debt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debt'
        '400':
          description: Invalid debt fields
        '401':
          description: Login required
        '404':
          description: Debt not found
    delete:
      summary: Delete one of the logged-in user's debts
      operationId: deleteDebt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Debt deleted
        '401':
          description: Login required
        '404':
          description: Debt not found
  /debts/snowball:
    post:
      summary: Compute a debt-snowball payoff projection from the user's debts
      operationId: projectSnowball
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                extra_payment:
                  type: number
                  minimum: 0
                  description: Extra monthly amount rolled into the smallest debt.
                start_month:
                  type: string
                  description: Month the projection begins (YYYY-MM); defaults to the current month.
      responses:
        '200':
          description: Snowball projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnowballProjection'
        '400':
          description: Invalid input or no debts to project
        '401':
          description: Login required
components:
  schemas:
    Debt:
      type: object
      required: [id, name, balance, min_payment, apr]
      properties:
        id:
          type: integer
        name:
          type: string
        balance:
          type: number
        min_payment:
          type: number
        apr:
          type: number
          description: Annual percentage rate as a percent (e.g. 30 = 30%/yr).
        sort_order:
          type: integer
    DebtInput:
      type: object
      required: [name, balance, min_payment]
      properties:
        name:
          type: string
          maxLength: 255
        balance:
          type: number
          minimum: 0
        min_payment:
          type: number
          minimum: 0
        apr:
          type: number
          minimum: 0
    SnowballProjection:
      type: object
      properties:
        payable:
          type: boolean
          description: False when interest outpaces the minimum payments.
        extra_payment:
          type: number
        total_months:
          type: integer
          nullable: true
        debt_free_month:
          type: string
          nullable: true
        total_interest_paid:
          type: number
        payoff_order:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              payoff_month:
                type: integer
                nullable: true
              calendar_month:
                type: string
                nullable: true
        monthly_breakdown:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
              calendar_month:
                type: string
              snowball_amount:
                type: number
              payments:
                type: array
                items:
                  type: object
                  properties:
                    debt:
                      type: string
                    payment:
                      type: number
                    remaining_balance:
                      type: number
    SriSource:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
        vendor:
          type: string
          enum: [SRI]
    GisSource:
      type: object
      required: [county, state, url]
      properties:
        county:
          type: string
        state:
          type: string
        url:
          type: string
          format: uri
    Project:
      type: object
      required: [name, description, url]
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
    SaleProperty:
      type: object
      required: [address, map_url]
      properties:
        address:
          type: string
        county:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        sale_status:
          type: string
          nullable: true
        sale_group:
          type: string
          nullable: true
        map_url:
          type: string
        parcel:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        sri_id:
          type: string
          nullable: true
        sri_property_id:
          type: string
          nullable: true
        scraped_at:
          type: string
          format: date-time
    BudgetTransaction:
      type: object
      required: [transaction_date, description, amount, category]
      properties:
        transaction_date:
          type: string
          format: date
        description:
          type: string
        merchant:
          type: string
          nullable: true
        amount:
          type: number
        category:
          type: string
        account:
          type: string
          nullable: true

